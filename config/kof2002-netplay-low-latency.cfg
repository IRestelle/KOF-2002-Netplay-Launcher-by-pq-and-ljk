# Rescue netplay profile for KOF 2002 over unstable Radmin VPN/high packet loss.
# 60 frames ~= 1000 ms at 60 fps. This is very sluggish, but best for avoiding disconnects.
netplay_delay_frames = "60"
netplay_check_frames = "0"
netplay_client_swap_input = "true"
netplay_spectator_mode_enable = "false"
video_max_swapchain_images = "3"
video_hard_sync = "false"
video_hard_sync_frames = "0"
video_frame_delay = "0"
video_threaded = "false"
audio_latency = "96"
run_ahead_enabled = "false"
